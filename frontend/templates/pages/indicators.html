{% extends "base.html" %}
{% block title %}指标管理 · 机场群顽存能力仿真系统{% endblock %}
{% block head %}<link rel="stylesheet" href="{{ url_for('static', filename='css/indicators.css') }}">{% endblock %}
{% block content %}
<main class="indicator-page shell-content">
  <!-- 指标管理不参与算法运行；完整说明已收敛至标题旁 tooltip。 -->
  <header class="indicator-header">
    <div class="indicator-title">
      <h1>指标管理</h1>
      <span class="info-icon" tabindex="0" aria-label="指标管理说明" title="维护指标定义与评分权重；指标管理不直接参与算法运行。">i</span>
    </div>
    <div class="indicator-set-tools">
      <label for="indicatorSetSelect">指标集</label>
      <select id="indicatorSetSelect" class="control" aria-label="当前指标集"></select>
      <span id="indicatorSetStatus" class="badge hidden">草稿</span>
      <div class="indicator-search" role="search">
        <input id="indicatorSearch" class="control" type="search" name="indicator-search-query" aria-label="搜索指标名称或业务编码" placeholder="搜索指标名称或业务编码" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button id="indicatorSearchButton" class="indicator-search-button" type="button" aria-label="应用指标搜索" title="搜索">⌕</button>
      </div>
      <button id="openScoreDrawer" class="btn" type="button" aria-expanded="false" aria-controls="scoreDrawer">评分</button>
      <button id="newIndicatorSet" class="btn hidden" type="button">基于此新建</button>
      <button id="publishIndicatorSet" class="btn primary hidden" type="button">发布</button>
    </div>
  </header>

  <section id="indicatorSystemPane" class="indicator-system-pane">
    <section id="indicatorL1" class="indicator-hierarchy" aria-label="三级指标体系；草稿分组可新增三级指标">
      <div id="indicatorL2" class="indicator-hierarchy-body">
        <div id="indicatorL3" class="indicator-columns"></div>
      </div>
    </section>
  </section>

  <aside id="scoreDrawer" class="score-drawer" aria-hidden="true" aria-labelledby="scoreDrawerTitle">
    <header class="score-drawer-head">
      <div><h2 id="scoreDrawerTitle">专家评分</h2><span id="scoreStatus" class="badge">未评分</span></div>
    </header>
    <div class="score-drawer-body">
      <div class="field score-group-field">
        <label for="scoreGroupSelect">二级指标</label>
        <select id="scoreGroupSelect" class="control"></select>
      </div>
      <div class="score-drawer-meta">
        <strong id="scoreGroupProgress">已填写 0 / 0</strong>
        <span class="score-rule"><span class="info-icon" tabindex="0" aria-label="评分规则" title="评分范围为0～100；提交后按同一二级指标下的三级指标评分归一化形成权重。">i</span> 评分规则</span>
      </div>
      <div id="scoreRows" class="score-rows"><div class="score-empty">正在加载评分表…</div></div>
    </div>
    <footer class="score-actions"><button id="saveScoreDraft" class="btn" type="button" disabled>保存</button><button id="submitScores" class="btn primary" type="button" disabled>提交评分</button></footer>
  </aside>

  <aside id="indicatorInspector" class="indicator-inspector" aria-hidden="true" aria-labelledby="indicatorInspectorTitle">
    <div id="indicatorInspectorBody" class="indicator-inspector-body"></div>
  </aside>

  <div id="indicatorMessage" class="workspace-message hidden" role="alert"></div>

  <div id="indicatorSetModal" class="shell-modal-backdrop" aria-hidden="true">
    <section class="shell-modal" role="dialog" aria-modal="true" aria-labelledby="indicatorSetModalTitle">
      <header><strong id="indicatorSetModalTitle">新建指标集</strong></header>
      <div class="body">
        <div class="field required"><label for="newSetName">名称</label><input id="newSetName" class="control" placeholder="例如 保障指标集·试验方案A"></div>
        <div class="field required"><label for="newSetVersion">标识</label><input id="newSetVersion" class="control" placeholder="例如 CUSTOM-A"></div>
        <div class="field"><label for="newSetSource">基于</label><select id="newSetSource" class="control"></select><div class="field-note">复制既有已发布指标集，保留一级/二级结构和受保护核心指标，再维护自己的三级指标。</div></div>
        <div class="field"><label for="newSetDescription">说明</label><textarea id="newSetDescription" class="control textarea-control" rows="3"></textarea></div>
        <div id="newSetMessage" class="inline-message hidden"></div>
      </div>
      <footer><button id="newSetCancel" class="btn ghost" type="button">取消</button><button id="newSetConfirm" class="btn primary" type="button">创建草稿</button></footer>
    </section>
  </div>
</main>
{% endblock %}
{% block scripts %}<script type="module" src="{{ url_for('static', filename='js/modules/indicators.js') }}"></script>{% endblock %}
