<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · 机场群顽存能力仿真系统</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
<main class="login-page" id="loginPage" data-next="{{ next_path|default('/run') }}">
  <section class="login-visual" aria-hidden="true"></section>
  <section class="login-side">
    <div class="login-panel-wrap">
      <form id="loginForm" class="login-card" novalidate>
        <header class="login-card-brand">
          <img class="login-emblem" src="{{ url_for('static', filename='icons/airforce-emblem.png') }}" alt="" aria-hidden="true">
          <div>
            <h2>用户登录</h2>
            <div class="login-system-name">机场群顽存能力仿真系统</div>
          </div>
        </header>
        <div id="loginMessage" class="inline-message error hidden" role="alert"></div>
        <div class="field required"><label for="loginName">用户名</label><input id="loginName" class="control" name="username" autocomplete="username" required></div>
        <div class="field required"><label for="loginPassword">密码</label><input id="loginPassword" class="control" name="password" type="password" autocomplete="current-password" required></div>
        <button id="loginButton" class="btn primary" type="submit">登录</button>
      </form>
    </div>
  </section>
</main>
<script type="module" src="{{ url_for('static', filename='js/modules/login.js') }}"></script>
</body>
</html>
