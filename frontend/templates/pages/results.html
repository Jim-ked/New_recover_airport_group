{% extends "base.html" %}
{% block title %}结果分析 · 机场群顽存能力仿真系统{% endblock %}
{% block head %}<link rel="stylesheet" href="{{ url_for('static', filename='css/results.css') }}">{% endblock %}
{% block content %}
<main class="results-page" id="resultsPage">
  <nav class="results-tabs" aria-label="结果分析工作区">
    <button type="button" class="active" data-workspace="damage">严格损毁对照</button>
    <button type="button" data-workspace="multi">严格多损毁对照</button>
    <button type="button" data-workspace="configuration">严格配置对照</button>
    <button type="button" data-workspace="exploratory">跨条件描述性探索</button>
  </nav>

  <section class="results-condition">
    <strong id="conditionTitle">当前比较条件</strong>
    <div id="conditionFacts" class="condition-facts" role="status" aria-live="polite">正在读取运行结果…</div>
    <div id="resultsScopeError" class="results-scope-error hidden" role="alert"></div>
    <span class="condition-spacer"></span>
    <div id="resultsConditionActions" class="results-condition-actions">
      <button id="resultsRulesButton" class="btn hidden" type="button">查看比较条件</button>
      <a id="resultsRunLink" class="btn primary hidden" href="/run">前往算法运行</a>
      <button id="changeConditionButton" class="btn hidden" type="button">选择比较条件</button>
      <button id="resultsRetryButton" class="btn hidden" type="button">重试</button>
      <div id="resultsExport" class="results-export hidden"><button id="resultsExportButton" class="btn" type="button" disabled aria-expanded="false">导出</button><div id="resultsExportMenu" class="results-export-menu" aria-hidden="true"><button type="button" data-export-format="pdf">PDF 汇总报告</button><button type="button" data-export-format="csv">CSV 表格数据</button><button type="button" data-export-format="json">JSON 结构化数据</button><button type="button" data-export-format="xml">XML 结构化数据</button></div></div>
    </div>
  </section>
  <section id="resultsConditionMatrix" class="results-box results-condition-matrix hidden" aria-label="运行条件矩阵"></section>
  <section id="resultsMetrics" class="results-metrics hidden"></section>
  <section id="resultsSolverComparison" class="results-box results-solver-comparison hidden" aria-label="求解事实与目标区间"></section>

  <section id="resultsMain" class="results-main">
    <article class="results-box chart-box">
      <header class="results-box-head">
        <strong id="resultsChartTitle">时序比较</strong>
        <div id="resultsChartControls" class="results-chart-controls hidden">
          <div class="results-segmented-groups">
            <div id="resultsSeriesKind" class="segmented" role="group" aria-label="时序类型">
              <button type="button" class="active" data-series-kind="departures">出动</button>
              <button type="button" data-series-kind="returns">返航</button>
            </div>
            <div id="resultsChartModes" class="segmented" role="group" aria-label="图表对象类型">
              <button type="button" class="active" data-chart-mode="all">全部</button>
              <button type="button" data-chart-mode="airport">机场</button>
              <button type="button" data-chart-mode="mission">任务</button>
              <button type="button" data-chart-mode="aircraft">机型</button>
            </div>
          </div>
          <select id="resultsObjectSelect" class="mini-select hidden" aria-label="选择比较对象"></select>
        </div>
      </header>
      <div id="resultsChart" class="results-chart"><div class="results-placeholder">加载中…</div></div>
      <div id="resultsLegend" class="results-legend"></div>
    </article>

    <aside class="results-box diff-box">
      <header class="results-box-head"><strong id="resultsDiffTitle">关键差异</strong></header>
      <div id="resultsDiff" class="results-diff"><div class="results-placeholder">—</div></div>
    </aside>
  </section>

  <section id="resultsBottom" class="results-bottom">
    <nav class="results-bottom-nav">
      <button type="button" class="active" data-bottom-mode="airports">全机场承接</button>
      <button type="button" data-bottom-mode="resources">资源变化</button>
      <button type="button" data-bottom-mode="scheme">方案结构</button>
      <span></span>
      <div id="resultsAirportValueControls" class="results-airport-value-controls hidden">
        <button type="button" class="small active" data-airport-value="sorties">出动架次</button>
        <button type="button" class="small" data-airport-value="share">承接占比</button>
      </div>
    </nav>
    <div id="resultsTable" class="results-table-wrap"><div class="results-placeholder">—</div></div>
  </section>

  <section id="resultsObjectDrilldown" class="results-box results-object-drilldown">
    <header class="results-box-head">
      <div><strong>对象级下钻</strong><small>以同一业务对象比较绝对值、基准值和差值</small></div>
      <div class="results-object-controls">
        <label>对象类型<select id="resultsObjectType" class="mini-select"><option value="task">任务</option><option value="airport">机场</option><option value="resource">资源</option><option value="aircraft">航空器</option><option value="collaboration">完整航链与协同</option></select></label>
        <label id="resultsObjectIdWrap">对象<select id="resultsObjectId" class="mini-select"></select></label>
        <label id="resultsObjectAirportWrap" class="hidden">机场<select id="resultsObjectAirport" class="mini-select"></select></label>
        <label id="resultsObjectResourceWrap" class="hidden">具体资源<select id="resultsObjectResource" class="mini-select"></select></label>
        <label id="resultsObjectAircraftWrap" class="hidden">机型<select id="resultsObjectAircraft" class="mini-select"></select></label>
      </div>
    </header>
    <div id="resultsObjectDetail" class="results-object-detail"><div class="results-placeholder">选择比较条件后查看对象变化</div></div>
  </section>

  <aside id="resultsOverlay" class="results-overlay" aria-label="修改比较条件" aria-hidden="true">
    <header><strong id="resultsOverlayTitle">选择比较条件</strong><button id="closeResultsOverlay" type="button" class="btn ghost" aria-label="关闭比较条件抽屉">×</button></header>
    <div id="resultsOverlaySearch" class="results-overlay-search"><input id="resultsRunSearch" class="control" type="search" name="results-run-query" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="搜索 Run ID、情境或损毁场景" aria-label="搜索成功 Run"></div>
    <div id="resultsOverlayBody" class="results-overlay-body"></div>
    <footer id="resultsOverlayFooter"><button id="cancelResultsOverlay" type="button" class="btn">取消</button><button id="applyResultsComparison" type="button" class="btn primary" disabled>应用比较</button></footer>
  </aside>

  <div id="resultsError" class="results-error hidden" role="alert"></div>
</main>
{% endblock %}
{% block scripts %}<script type="module" src="{{ url_for('static', filename='js/modules/results.js') }}"></script>{% endblock %}
