<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}机场群顽存能力仿真系统{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/shell.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
  {% block head %}{% endblock %}
</head>
<body data-authenticated="{{ 'true' if session_user else 'false' }}">
<div class="app-shell">
  <header class="topbar">
    <div class="brand" aria-label="机场群顽存能力仿真系统">
      <span class="brand-mark" aria-hidden="true"><i></i></span>
      <strong>机场群顽存能力仿真系统</strong>
    </div>
    <div class="top-spacer"></div>
    <div class="account-menu" id="accountMenu">
      <button id="accountTrigger" class="account-trigger" type="button" aria-haspopup="menu" aria-expanded="false">
        <span class="avatar" aria-hidden="true">{% if session_user %}{{ (session_user.get('display_name') or session_user.get('login_name') or session_user.get('name') or session_user.get('user_id') or 'U')[0] }}{% else %}U{% endif %}</span>
        <span class="account-copy">
          <strong id="accountDisplayName">{% if session_user %}{{ session_user.get('display_name') or session_user.get('login_name') or session_user.get('name') or session_user.get('user_id') or '已登录' }}{% else %}未登录{% endif %}</strong>
          <small id="accountRole">{% if session_user %}{{ session_user.get('role') or 'viewer' }}{% else %}—{% endif %}</small>
        </span>
        <span class="account-chevron" aria-hidden="true">⌄</span>
      </button>
      <div id="accountPopover" class="account-popover" role="menu" aria-hidden="true">
        <div class="account-summary">
          <strong id="accountSummaryName">当前账号</strong>
          <small id="accountSummaryRole">正在读取权限…</small>
        </div>
        <button id="changePasswordAction" class="account-action" type="button" role="menuitem">修改密码</button>
        <button id="logoutAction" class="account-action danger" type="button" role="menuitem">退出登录</button>
      </div>
    </div>
  </header>

  <aside class="sidebar" aria-label="主导航">
    <nav>
      <a class="nav{% if active_nav|default('run') == 'situation' %} active{% endif %}" href="{{ url_for('ui_v1.situations_page') }}"{% if active_nav|default('run') == 'situation' %} aria-current="page"{% endif %}><b>◫</b>情境构建</a>
      <a class="nav{% if active_nav|default('run') == 'indicators' %} active{% endif %}" href="{{ url_for('ui_v1.indicators_page') }}"{% if active_nav|default('run') == 'indicators' %} aria-current="page"{% endif %}><b>▦</b>指标管理</a>
      <a class="nav{% if active_nav|default('run') == 'run' %} active{% endif %}" href="{{ url_for('ui_v1.run_page') }}"{% if active_nav|default('run') == 'run' %} aria-current="page"{% endif %}><b>▣</b>算法运行</a>
      <a class="nav{% if active_nav|default('run') == 'results' %} active{% endif %}" href="{{ url_for('ui_v1.results_page') }}"{% if active_nav|default('run') == 'results' %} aria-current="page"{% endif %}><b>▱</b>结果分析</a>
    </nav>
  </aside>

  {% block content %}{% endblock %}
</div>

<div id="passwordModal" class="shell-modal-backdrop" aria-hidden="true">
  <section class="shell-modal" role="dialog" aria-modal="true" aria-labelledby="passwordModalTitle">
    <header><strong id="passwordModalTitle">修改密码</strong></header>
    <div class="body">
      <div id="passwordMessage" class="inline-message hidden" role="alert"></div>
      <div class="field"><label for="currentPassword">当前密码</label><input id="currentPassword" class="control" type="password" autocomplete="current-password"></div>
      <div class="field"><label for="newPassword">新密码</label><input id="newPassword" class="control" type="password" autocomplete="new-password"></div>
      <div class="field"><label for="newPasswordAgain">确认新密码</label><input id="newPasswordAgain" class="control" type="password" autocomplete="new-password"></div>
      <div class="field-note">修改成功后当前及其他旧会话全部失效，需要重新登录。</div>
    </div>
    <footer><button id="passwordCancel" class="btn ghost" type="button">取消</button><button id="passwordSave" class="btn primary" type="button">修改并重新登录</button></footer>
  </section>
</div>
{% block scripts %}{% endblock %}
<script type="module" src="{{ url_for('static', filename='js/modules/shell.js') }}"></script>
</body>
</html>
