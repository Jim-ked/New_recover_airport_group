<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}机场群顽存能力仿真系统{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/shell.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
  {% block head %}{% endblock %}
</head>
<body data-authenticated="{{ 'true' if session_user else 'false' }}">
<svg class="ui-symbols" aria-hidden="true">
  <symbol id="i-brand" viewBox="0 0 24 24">
    <path d="M2.5 13.5 9 11l2.2-7h1.6L15 11l6.5 2.5-6.5 1.1-2.2 5.4h-1.6L9 14.6Z"/>
    <path d="M5 18h14"/>
  </symbol>
  <symbol id="i-situation" viewBox="0 0 24 24">
    <rect x="4" y="4" width="6" height="6" rx="1"/>
    <rect x="14" y="4" width="6" height="6" rx="1"/>
    <rect x="4" y="14" width="6" height="6" rx="1"/>
    <path d="M17 14v6M14 17h6"/>
  </symbol>
  <symbol id="i-indicator" viewBox="0 0 24 24">
    <path d="M5 19V11M12 19V5M19 19V8"/>
  </symbol>
  <symbol id="i-run" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="8"/>
    <path d="m10 8 6 4-6 4Z"/>
  </symbol>
  <symbol id="i-results" viewBox="0 0 24 24">
    <path d="M4 19V5M4 19h16M7 15l4-4 3 2 5-6"/>
  </symbol>
  <symbol id="i-database" viewBox="0 0 24 24">
    <ellipse cx="12" cy="6" rx="7" ry="3"/>
    <path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/>
  </symbol>
  <symbol id="i-settings" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="3"/>
    <path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/>
  </symbol>
  <symbol id="i-airport" viewBox="0 0 24 24">
    <path d="M3 14.5 10 12l2.2-7h1.6L16 12l5 2.5-5 1-2.2 4.5h-1.6L10 15.5Z"/>
  </symbol>
  <symbol id="i-task" viewBox="0 0 24 24">
    <rect x="6" y="5" width="12" height="15" rx="2"/>
    <path d="M9 9h6M9 13h6M9 17h4"/>
  </symbol>
  <symbol id="i-damage" viewBox="0 0 24 24">
    <path d="M12 3 21 20H3Z"/>
    <path d="M12 8v5M12 17h.01"/>
  </symbol>
  <symbol id="i-layers" viewBox="0 0 24 24">
    <path d="m12 4 8 4-8 4-8-4Z"/>
    <path d="m4 12 8 4 8-4M4 16l8 4 8-4"/>
  </symbol>
  <symbol id="i-search" viewBox="0 0 24 24">
    <circle cx="10.5" cy="10.5" r="5.5"/>
    <path d="m15 15 5 5"/>
  </symbol>
  <symbol id="i-plus" viewBox="0 0 24 24">
    <path d="M12 5v14M5 12h14"/>
  </symbol>
  <symbol id="i-save" viewBox="0 0 24 24">
    <path d="M5 4h12l2 2v14H5Z"/>
    <path d="M8 4v6h8V4M8 16h8"/>
  </symbol>
  <symbol id="i-trash" viewBox="0 0 24 24">
    <path d="M5 7h14M9 7V4h6v3M8 10v7M12 10v7M16 10v7M6 7l1 13h10l1-13"/>
  </symbol>
  <symbol id="i-info" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="8"/>
    <path d="M12 11v5M12 8h.01"/>
  </symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24">
    <path d="m8 10 4 4 4-4"/>
  </symbol>
  <symbol id="i-user" viewBox="0 0 24 24">
    <circle cx="12" cy="8" r="3"/>
    <path d="M5 20c.8-4 3-6 7-6s6.2 2 7 6"/>
  </symbol>
  <symbol id="i-close" viewBox="0 0 24 24">
    <path d="m7 7 10 10M17 7 7 17"/>
  </symbol>
  <symbol id="i-filter" viewBox="0 0 24 24">
    <path d="M4 6h16M7 12h10M10 18h4"/>
  </symbol>
  <symbol id="i-arrow-right" viewBox="0 0 24 24">
    <path d="m9 6 6 6-6 6"/>
  </symbol>
</svg>

<div class="app-shell">
  <header class="topbar">
    <div class="brand" aria-label="机场群顽存能力仿真系统">
      <span class="brand-emblem" aria-hidden="true">
        <svg class="ui-icon brand-icon"><use href="#i-brand"></use></svg>
      </span>
      <strong>机场群顽存能力仿真系统</strong>
    </div>

    <div class="topbar-page-context">
      {% block topbar_context %}{% endblock %}
    </div>

    <div class="top-spacer"></div>

    <div class="account-menu" id="accountMenu">
      <button id="accountTrigger" class="account-trigger" type="button" aria-haspopup="menu" aria-expanded="false">
        <span class="avatar" aria-hidden="true">
          <svg class="ui-icon"><use href="#i-user"></use></svg>
        </span>
        <span class="account-copy">
          <strong id="accountDisplayName">{% if session_user %}{{ session_user.get('display_name') or session_user.get('login_name') or session_user.get('name') or session_user.get('user_id') or '已登录' }}{% else %}未登录{% endif %}</strong>
          <small id="accountRole">{% if session_user %}{{ session_user.get('role') or 'viewer' }}{% else %}—{% endif %}</small>
        </span>
        <svg class="ui-icon account-chevron"><use href="#i-chevron"></use></svg>
      </button>
      <div id="accountPopover" class="account-popover" role="menu" aria-hidden="true">
        <div class="account-summary">
          <strong id="accountSummaryName">当前账号</strong>
          <small id="accountSummaryRole">正在读取权限…</small>
        </div>
        <button id="accountInfoAction" class="account-action" type="button" role="menuitem">账户信息</button>
        <button id="changePasswordAction" class="account-action" type="button" role="menuitem">修改密码</button>
        <button id="logoutAction" class="account-action danger" type="button" role="menuitem">退出登录</button>
      </div>
    </div>
  </header>

  <aside class="sidebar" aria-label="主导航">
    <nav>
      <a class="nav{% if active_nav|default('run') == 'situation' and not base_data_active|default(false) %} active{% endif %}" href="{{ url_for('ui_v1.situations_page') }}"{% if active_nav|default('run') == 'situation' and not base_data_active|default(false) %} aria-current="page"{% endif %}>
        <svg class="ui-icon nav-icon"><use href="#i-situation"></use></svg><span>情境构建</span>
      </a>
      <a class="nav{% if active_nav|default('run') == 'indicators' %} active{% endif %}" href="{{ url_for('ui_v1.indicators_page') }}"{% if active_nav|default('run') == 'indicators' %} aria-current="page"{% endif %}>
        <svg class="ui-icon nav-icon"><use href="#i-indicator"></use></svg><span>指标管理</span>
      </a>
      <a class="nav{% if active_nav|default('run') == 'run' %} active{% endif %}" href="{{ url_for('ui_v1.run_page') }}"{% if active_nav|default('run') == 'run' %} aria-current="page"{% endif %}>
        <svg class="ui-icon nav-icon"><use href="#i-run"></use></svg><span>算法运行</span>
      </a>
      <a class="nav{% if active_nav|default('run') == 'results' %} active{% endif %}" href="{{ url_for('ui_v1.results_page') }}"{% if active_nav|default('run') == 'results' %} aria-current="page"{% endif %}>
        <svg class="ui-icon nav-icon"><use href="#i-results"></use></svg><span>结果分析</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <a class="nav secondary-nav{% if base_data_active|default(false) %} active{% endif %}" href="{{ url_for('ui_v1.base_data_page') }}"{% if base_data_active|default(false) %} aria-current="page"{% endif %}>
        <svg class="ui-icon nav-icon"><use href="#i-database"></use></svg><span>基础数据</span>
      </a>
      <a class="nav secondary-nav{% if active_nav|default('run') == 'settings' %} active{% endif %}" href="{{ url_for('ui_v1.settings_page') }}"{% if active_nav|default('run') == 'settings' %} aria-current="page"{% endif %}>
        <svg class="ui-icon nav-icon"><use href="#i-settings"></use></svg><span>系统设置</span>
      </a>
    </div>
  </aside>

  {% block content %}{% endblock %}
</div>

<div id="accountInfoModal" class="shell-modal-backdrop" aria-hidden="true">
  <section class="shell-modal" role="dialog" aria-modal="true" aria-labelledby="accountInfoTitle">
    <header><strong id="accountInfoTitle">账户信息</strong></header>
    <div id="accountInfoBody" class="body account-info-body"></div>
    <footer><button id="accountInfoClose" class="btn primary" type="button">关闭</button></footer>
  </section>
</div>

<div id="passwordModal" class="shell-modal-backdrop" aria-hidden="true">
  <section class="shell-modal" role="dialog" aria-modal="true" aria-labelledby="passwordModalTitle">
    <header><strong id="passwordModalTitle">修改密码</strong></header>
    <div class="body">
      <div id="passwordMessage" class="inline-message hidden" role="alert"></div>
      <div class="field"><label for="currentPassword">当前密码</label><input id="currentPassword" class="control" type="password" autocomplete="current-password"></div>
      <div class="field"><label for="newPassword">新密码</label><input id="newPassword" class="control" type="password" autocomplete="new-password"></div>
      <div class="field"><label for="newPasswordAgain">确认新密码</label><input id="newPasswordAgain" class="control" type="password" autocomplete="new-password"></div>
      <div class="field-note">修改后需要重新登录。</div>
    </div>
    <footer>
      <button id="passwordCancel" class="btn ghost" type="button">取消</button>
      <button id="passwordSave" class="btn primary" type="button">确认修改</button>
    </footer>
  </section>
</div>

{% block scripts %}{% endblock %}
<script type="module" src="{{ url_for('static', filename='js/modules/shell.js') }}"></script>
</body>
</html>
